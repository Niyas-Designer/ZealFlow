services:
  - type: web
    name: ai-garment-automation-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JOBS_DIR
        value: /tmp/zip_jobs
